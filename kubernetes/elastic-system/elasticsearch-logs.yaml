# Elasticsearch Logs Cluster
# Main logging cluster for collecting all application and system logs
# 3-node cluster with hot tier storage

apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: logs
  namespace: elastic-system
spec:
  version: 9.2.4

  # Stack Monitoring - send metrics to monitoring cluster
  monitoring:
    metrics:
      elasticsearchRefs:
      - name: monitoring
        namespace: elastic-system
    logs:
      elasticsearchRefs:
      - name: monitoring
        namespace: elastic-system

  nodeSets:
  - name: default
    count: 3
    config:
      # Disable memory mapping for containerized environments
      node.store.allow_mmap: false

      # Cluster settings
      cluster.routing.allocation.disk.threshold_enabled: true
      cluster.routing.allocation.disk.watermark.low: 85%
      cluster.routing.allocation.disk.watermark.high: 90%
      cluster.routing.allocation.disk.watermark.flood_stage: 95%

      # Node roles (all nodes are data + master eligible for dev)
      node.roles:
        - master
        - data
        - data_content
        - data_hot
        - ingest
        - transform
        - remote_cluster_client

      # Note: Do NOT set xpack.security.enabled - reserved in ES 8.17+

    podTemplate:
      metadata:
        labels:
          app: elasticsearch
          cluster: logs
      spec:
        # Schedule on dedicated elastic nodes
        nodeSelector:
          node-group: elastic

        # Tolerate the elasticsearch taint
        tolerations:
        - key: dedicated
          operator: Equal
          value: elasticsearch
          effect: NoSchedule

        # Init container to set vm.max_map_count
        initContainers:
        - name: sysctl
          securityContext:
            privileged: true
            runAsUser: 0
          command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']

        containers:
        - name: elasticsearch
          resources:
            requests:
              memory: 4Gi
              cpu: 1
            limits:
              memory: 4Gi
              cpu: 2
          env:
          - name: ES_JAVA_OPTS
            value: "-Xms2g -Xmx2g"

    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: gp3

  # HTTP settings with TLS
  http:
    tls:
      selfSignedCertificate:
        disabled: false
        subjectAltNames:
        - dns: logs-es-http.elastic-system.svc
        - dns: logs-es-http.elastic-system.svc.cluster.local
        - dns: "*.logs-es-default.elastic-system.svc"
