# APM Server - Application Performance Monitoring
# Receives traces, metrics, and errors from APM agents in applications
# Deployed as Elastic Agent with APM integration
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: apm-server
  namespace: elastic-system
spec:
  version: 9.2.4
  kibanaRef:
    name: kibana
  fleetServerRef:
    name: fleet-server
  mode: fleet
  policyID: apm-server-policy
  deployment:
    replicas: 1
    podTemplate:
      spec:
        automountServiceAccountToken: true
        securityContext:
          runAsUser: 0
        containers:
          - name: agent
            resources:
              requests:
                memory: 512Mi
                cpu: 100m
              limits:
                memory: 1Gi
                cpu: 500m
            ports:
              - containerPort: 8200
                name: apm
                protocol: TCP

---
# Service for APM Server
apiVersion: v1
kind: Service
metadata:
  name: apm-server
  namespace: elastic-system
  labels:
    app: apm-server
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      protocol: TCP
      name: apm
  selector:
    agent.k8s.elastic.co/name: apm-server
