# GatewayClass - Defines the Envoy Gateway controller
# PORTABLE: This manifest works on any Kubernetes cluster with Envoy Gateway installed
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: "Envoy Gateway controller - portable across EKS and VKS"
