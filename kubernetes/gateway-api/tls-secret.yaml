# TLS Secret for Gateway
# PORTABLE: Same structure on any platform
#
# Option 1: Use Elasticsearch CA (reuse existing certs)
# Option 2: Generate dedicated gateway certs
# Option 3: Use cert-manager to automate
#
# This template shows the structure - replace with actual certs
---
apiVersion: v1
kind: Secret
metadata:
  name: elastic-gateway-tls
  namespace: elastic-system
  labels:
    app: elastic-gateway
type: kubernetes.io/tls
data:
  # Base64 encoded certificate (PEM format)
  # Must include SAN for: *.elastic.internal
  tls.crt: |
    # Replace with: cat your-cert.pem | base64 -w0
    LS0tLS1CRUdJTi...

  # Base64 encoded private key (PEM format)
  tls.key: |
    # Replace with: cat your-key.pem | base64 -w0
    LS0tLS1CRUdJTi...

---
# Alternative: Use existing Elasticsearch CA
# This copies the CA from the logs-es-http-certs-internal secret
# Useful for development/testing
apiVersion: v1
kind: Secret
metadata:
  name: elastic-gateway-tls-from-es
  namespace: elastic-system
  annotations:
    description: "Copy TLS from Elasticsearch - for dev/test only"
type: kubernetes.io/tls
stringData:
  # Instructions to create from ES certs:
  # kubectl get secret logs-es-http-certs-internal -n elastic-system -o jsonpath='{.data.tls\.crt}' | base64 -d > tls.crt
  # kubectl get secret logs-es-http-certs-internal -n elastic-system -o jsonpath='{.data.tls\.key}' | base64 -d > tls.key
  # kubectl create secret tls elastic-gateway-tls --cert=tls.crt --key=tls.key -n elastic-system
  placeholder: "See instructions above"
