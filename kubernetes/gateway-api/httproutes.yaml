# HTTPRoutes - Application routing rules
# 100% PORTABLE: These manifests are identical on EKS and VKS
# App teams can use these as templates without modification
---
# Kibana HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana-route
  namespace: elastic-system
  labels:
    app: kibana
    gateway: elastic-gateway
spec:
  parentRefs:
    - name: elastic-gateway
      namespace: elastic-system
      sectionName: https-kibana
  hostnames:
    - "kibana.elastic.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kibana-kb-http
          port: 5601
          weight: 100

---
