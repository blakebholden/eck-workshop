---
# HTTP to HTTPS redirect for Kibana
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana-redirect
  namespace: elastic-system
  labels:
    app: kibana
    purpose: http-redirect
spec:
  parentRefs:
    - name: elastic-gateway
      namespace: elastic-system
      sectionName: http
  hostnames:
    - "kibana.elastic.internal"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
